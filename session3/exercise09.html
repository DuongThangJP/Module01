<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tìm kiếm sản phẩm</h1>
    <form>

        <label for="keyword">Từ khóa tìm kiếm</label><br>
        <input type="text" id="keyword" name="keyword" placeholder="Nhập từ khóa..."><br><br>

        <label for="category">Loại sản phẩm</label><br>
        <select id="category" name="category">
            <option value="dien-tu">Điện tử</option>
            <option value="thoi-trang">Thời trang</option>
            <option value="gia-dung">Gia dụng</option>
            <option value="my-pham">Mỹ phẩm</option>
            <option value="the-thao">Thể thao</option>
        </select>
        <br><br>

        <button type="submit">Tìm kiếm</button>
    </form>
</body>
</html>
