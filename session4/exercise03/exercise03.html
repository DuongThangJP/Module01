<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./exercise03.css"/>
</head>
<body>
    <h1>Liên hệ với chúng tôi</h1>
    <br>
    <form action="">
       <div>
    <label for="fullname">Họ và tên</label><br>
    <input id="fullname" name="fullname" type="text" placeholder="Nhập họ và tên" required autocomplete="name">
</div>
<br>
<div> 
    <label for="email">Email</label><br>
    <input id="email" name="email" type="email" placeholder="Nhập email" required autocomplete="email">
</div>
<br>
<div>
    <label for="note">Tin nhắn</label><br>
    <textarea id="note" name="note" placeholder="Nhập nội dung tin nhắn" required></textarea>
</div>

        <div>
            <button type="submit">Gửi</button>
        </div>
    </form>
</body>
</html>
